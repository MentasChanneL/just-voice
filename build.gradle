plugins {
    id "fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
    maven { name = "Terraformers"; url = "https://maven.terraformersmc.com/" }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "justvoice" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    clientCompileOnly "net.fabricmc:sponge-mixin:0.15.5+mixin.0.8.7"
    clientAnnotationProcessor "net.fabricmc:sponge-mixin:0.15.5+mixin.0.8.7"
    modClientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    include(implementation("tech.kwik:kwik:0.12.2"))
    include(implementation("tech.kwik:agent15:4.0"))
    include(implementation("at.favre.lib:hkdf:2.0.0"))
    include(implementation("com.io7m.repackage.io.whitfin:io.whitfin.siphash:2.0.1"))
    include(clientImplementation("io.github.jaredmdobson:concentus:1.0.2"))

    testImplementation "org.junit.jupiter:junit-jupiter:5.12.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.12.2"
}

def modVersion = project.version.toString()

processResources {
    inputs.property "version", modVersion
    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
